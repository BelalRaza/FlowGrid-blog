<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">FlowGrid Phase 1 architecture</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Durable job state in PostgreSQL • job IDs delivered through Redis</text><rect x="80" y="260" width="300" height="135" rx="18" fill="white" stroke="#d7e1ea" stroke-width="2"/><text x="230.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#152c43" text-anchor="middle" font-weight="700">Client</text><text x="230.0" y="351" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Dashboard or API caller</text><rect x="590" y="260" width="350" height="135" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="765.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">FastAPI</text><text x="765.0" y="351" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Validate and submit</text><rect x="1170" y="260" width="340" height="135" rx="18" fill="#fff5e5" stroke="#e5c691" stroke-width="2"/><text x="1340.0" y="308" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#a66308" text-anchor="middle" font-weight="700">Redis</text><text x="1340.0" y="351" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Broker</text><rect x="590" y="610" width="350" height="150" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="765.0" y="658" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">PostgreSQL</text><text x="765.0" y="701" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Status · payload · result</text><rect x="1170" y="610" width="340" height="150" rx="18" fill="white" stroke="#d7e1ea" stroke-width="2"/><text x="1340.0" y="658" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#152c43" text-anchor="middle" font-weight="700">Celery worker</text><text x="1340.0" y="701" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Run registered handlers</text><polyline points="380,327 590,327" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="480" y="276" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#526579" text-anchor="middle" font-weight="400">REST</text><polyline points="940,327 1170,327" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="1055" y="231" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#526579" text-anchor="middle" font-weight="400">2 Publish</text><text x="1055" y="266" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#526579" text-anchor="middle" font-weight="400">job ID</text><polyline points="765,395 765,610" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="740" y="475" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="end" font-weight="400">1 Commit PENDING</text><text x="740" y="512" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="end" font-weight="400">3 Guard QUEUED</text><polyline points="1340,395 1340,610" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="1360" y="492" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Deliver ID</text><polyline points="1170,685 940,685" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><text x="1050" y="574" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#087f8c" text-anchor="middle" font-weight="400">4 Claim</text><text x="1050" y="610" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#087f8c" text-anchor="middle" font-weight="400">5 Record outcome</text><line x1="80" x2="1520" y1="810" y2="810" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="852" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Publication and the database commit are separate operations. State updates use predicates.</text></svg>