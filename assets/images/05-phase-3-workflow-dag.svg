<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">A workflow with parallel branches</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">All step jobs and dependency edges are created together when an immediate run starts</text><rect x="80" y="355" width="290" height="145" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="225.0" y="403" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">extract</text><text x="225.0" y="446" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">echo · root</text><rect x="610" y="205" width="350" height="145" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="785.0" y="253" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">batch_a</text><text x="785.0" y="296" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">process_records</text><rect x="610" y="520" width="350" height="145" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="785.0" y="568" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">batch_b</text><text x="785.0" y="611" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">process_records</text><rect x="1210" y="355" width="310" height="145" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="1365.0" y="403" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">report</text><text x="1365.0" y="446" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">summarize · fan in</text><polyline points="370,400 480,400 480,278 610,278" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><polyline points="370,455 480,455 480,593 610,593" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><polyline points="960,278 1080,278 1080,400 1210,400" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><polyline points="960,593 1080,593 1080,455 1210,455" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="784" y="440" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#526579" text-anchor="middle" font-weight="400">Independent branches</text><text x="1365" y="565" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Waits for both parents</text><line x1="80" x2="1520" y1="760" y2="760" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="802" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Root jobs start PENDING. Other steps start BLOCKED and receive direct parent results through ctx.upstream.</text></svg>