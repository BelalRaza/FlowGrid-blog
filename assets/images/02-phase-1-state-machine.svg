<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">The first job state machine</title><desc id="desc">Expected source states prevent the API from overwriting a faster worker</desc>
<defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c91a4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#af3b4b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3065ad"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a66308"/></marker></defs>
<rect width="1600" height="820" fill="#f7f9fc"/>
<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">The first job state machine</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Expected source states prevent the API from overwriting a faster worker</text><rect x="80" y="315" width="280" height="115" rx="18" fill="#fff5e5" stroke="#e5c691" stroke-width="2"/><text x="220.0" y="382.5" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#a66308" text-anchor="middle" font-weight="700">PENDING</text><rect x="530" y="315" width="280" height="115" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="670.0" y="382.5" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">QUEUED</text><rect x="980" y="315" width="280" height="115" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="1120.0" y="382.5" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">RUNNING</text><rect x="1295" y="200" width="260" height="100" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="1425.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">SUCCEEDED</text><rect x="1295" y="530" width="260" height="100" rx="18" fill="#fceef0" stroke="#e6b4be" stroke-width="2"/><text x="1425.0" y="590.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#af3b4b" text-anchor="middle" font-weight="700">FAILED</text><polyline points="360,373 530,373" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="445" y="342" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Publish</text><polyline points="810,373 980,373" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="895" y="342" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Claim</text><polyline points="1260,345 1278,345 1278,250 1295,250" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><polyline points="1260,405 1278,405 1278,580 1295,580" fill="none" stroke="#af3b4b" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/><polyline points="220,315 220,218 1120,218 1120,315" fill="none" stroke="#3065ad" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 7"/><text x="665" y="190" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#3065ad" text-anchor="middle" font-weight="400">Fast worker may claim before QUEUED is recorded</text><polyline points="220,430 220,650 1425,650 1425,630" fill="none" stroke="#af3b4b" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/><text x="750" y="625" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#af3b4b" text-anchor="middle" font-weight="400">Enqueue error while still PENDING</text><line x1="80" x2="1520" y1="730" y2="730" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="772" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Terminal writes require RUNNING. This phase has no retries, leases, or automatic reconciliation.</text></svg>