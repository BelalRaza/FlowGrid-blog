<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-labelledby="title desc">
<title id="title">Retries and terminal outcomes</title><desc id="desc">PostgreSQL stores the retry deadline and the history of every attempt</desc>
<defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c91a4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#af3b4b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3065ad"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a66308"/></marker></defs>
<rect width="1600" height="990" fill="#f7f9fc"/>
<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">Retries and terminal outcomes</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">PostgreSQL stores the retry deadline and the history of every attempt</text><rect x="80" y="315" width="260" height="120" rx="18" fill="#fff5e5" stroke="#e5c691" stroke-width="2"/><text x="210.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#a66308" text-anchor="middle" font-weight="700">PENDING</text><rect x="520" y="315" width="260" height="120" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="650.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">QUEUED</text><rect x="960" y="315" width="260" height="120" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="1090.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">RUNNING</text><rect x="1270" y="195" width="280" height="100" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="1410.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">SUCCEEDED</text><rect x="1270" y="440" width="280" height="100" rx="18" fill="#fceef0" stroke="#e6b4be" stroke-width="2"/><text x="1410.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#af3b4b" text-anchor="middle" font-weight="700">FAILED</text><rect x="1270" y="680" width="280" height="100" rx="18" fill="#fceef0" stroke="#e6b4be" stroke-width="2"/><text x="1410.0" y="740.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#af3b4b" text-anchor="middle" font-weight="700">DEAD_LETTER</text><rect x="480" y="675" width="360" height="140" rx="18" fill="#fff5e5" stroke="#e5c691" stroke-width="2"/><text x="660.0" y="723" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#a66308" text-anchor="middle" font-weight="700">RETRY_SCHEDULED</text><text x="660.0" y="766" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">next_attempt_at</text><polyline points="340,375 520,375" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="430" y="342" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Publish</text><polyline points="780,375 960,375" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="870" y="342" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Claim</text><polyline points="1220,342 1244,342 1244,245 1270,245" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><polyline points="1220,405 1244,405 1244,490 1270,490" fill="none" stroke="#af3b4b" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/><text x="1410" y="581" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#af3b4b" text-anchor="middle" font-weight="400">Permanent error</text><polyline points="1090,435 1090,745 840,745" fill="none" stroke="#a66308" stroke-width="3" stroke-linejoin="round" marker-end="url(#amber)"/><text x="1060" y="572" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a66308" text-anchor="end" font-weight="400">Retryable failure</text><text x="1060" y="609" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a66308" text-anchor="end" font-weight="400">Attempts remain</text><polyline points="1125,435 1125,730 1270,730" fill="none" stroke="#af3b4b" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/><text x="1365" y="645" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#af3b4b" text-anchor="middle" font-weight="400">Budget exhausted</text><polyline points="480,745 210,745 210,435" fill="none" stroke="#a66308" stroke-width="3" stroke-linejoin="round" marker-end="url(#amber)"/><text x="320" y="640" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a66308" text-anchor="middle" font-weight="400">Backoff elapsed</text><text x="320" y="677" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a66308" text-anchor="middle" font-weight="400">Sweeper releases</text><line x1="80" x2="1520" y1="900" y2="900" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="942" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Timeouts and expired leases are retryable. Replay creates a new job and preserves the old record.</text></svg>