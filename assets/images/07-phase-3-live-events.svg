<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Live progress from committed database changes</title><desc id="desc">One shared LISTEN connection per API process feeds queues filtered by owner</desc>
<defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c91a4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#af3b4b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3065ad"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a66308"/></marker></defs>
<rect width="1600" height="1000" fill="#f7f9fc"/>
<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">Live progress from committed database changes</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">One shared LISTEN connection per API process feeds queues filtered by owner</text><rect x="80" y="235" width="380" height="145" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="270.0" y="283" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">PostgreSQL</text><text x="270.0" y="326" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Job and run triggers</text><rect x="610" y="235" width="410" height="145" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="815.0" y="283" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">API event bus</text><text x="815.0" y="326" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">LISTEN connection</text><rect x="1170" y="235" width="350" height="145" rx="18" fill="white" stroke="#d7e1ea" stroke-width="2"/><text x="1345.0" y="283" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#152c43" text-anchor="middle" font-weight="700">Client queues</text><text x="1345.0" y="326" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Bounded · owner filtered</text><polyline points="460,308 610,308" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><text x="535" y="200" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#087f8c" text-anchor="middle" font-weight="400">NOTIFY</text><polyline points="1020,308 1170,308" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><text x="1095" y="200" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Fan out</text><rect x="1170" y="570" width="350" height="145" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="1345.0" y="618" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">Dashboard</text><text x="1345.0" y="661" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">fetch SSE + REST</text><polyline points="1345,380 1345,570" fill="none" stroke="#3065ad" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1370" y="477" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#3065ad" text-anchor="start" font-weight="400">SSE hints</text><rect x="80" y="570" width="940" height="165" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="550.0" y="618" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">Refetch the current state</text><text x="550.0" y="661" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Reconnect or overflow → resync → authenticated REST read</text><polyline points="1170,644 1020,644" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><polyline points="270,570 270,380" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="9 7"/><text x="80" y="817" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#152c43" text-anchor="start" font-weight="400">No durable event replay. Streams recheck revocation periodically.</text><line x1="80" x2="1520" y1="910" y2="910" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="952" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">The request authentication session closes before streaming; the shared listener stays connected.</text></svg>