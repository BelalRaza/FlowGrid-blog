<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">Rejecting an obsolete worker outcome</title><desc id="desc">The attempt number acts as a fencing token on job outcome writes</desc>
<defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c91a4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#af3b4b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3065ad"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a66308"/></marker></defs>
<rect width="1600" height="880" fill="#f7f9fc"/>
<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">Rejecting an obsolete worker outcome</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">The attempt number acts as a fencing token on job outcome writes</text><rect x="80" y="210" width="420" height="145" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="290.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">Attempt 1</text><text x="290.0" y="301" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Claims job, then pauses</text><rect x="590" y="210" width="420" height="145" rx="18" fill="#fff5e5" stroke="#e5c691" stroke-width="2"/><text x="800.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#a66308" text-anchor="middle" font-weight="700">Sweeper</text><text x="800.0" y="301" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Lease expired → LOST</text><rect x="1100" y="210" width="420" height="145" rx="18" fill="#e8f5f4" stroke="#97cfc9" stroke-width="2"/><text x="1310.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#087f8c" text-anchor="middle" font-weight="700">Attempt 2</text><text x="1310.0" y="301" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Claims job; attempts = 2</text><polyline points="500,282 590,282" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><polyline points="1010,282 1100,282" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><rect x="80" y="505" width="420" height="150" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="290.0" y="553" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">Old worker resumes</text><text x="290.0" y="596" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Submits outcome for attempt 1</text><rect x="700" y="505" width="820" height="170" rx="18" fill="#fceef0" stroke="#e6b4be" stroke-width="2"/><text x="1110.0" y="553" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#af3b4b" text-anchor="middle" font-weight="700">Guard rejects stale outcome</text><text x="1110.0" y="596" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">RUNNING and attempts = 1 required</text><text x="1110.0" y="630" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Stored attempts = 2 → no row matches</text><polyline points="290,355 290,505" fill="none" stroke="#3065ad" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="9 7"/><text x="320" y="429" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#3065ad" text-anchor="start" font-weight="400">Later</text><polyline points="500,585 700,585" fill="none" stroke="#af3b4b" stroke-width="3" stroke-linejoin="round" marker-end="url(#red)"/><line x1="80" x2="1520" y1="790" y2="790" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="832" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Fencing protects job outcomes. External effects and handler writes need their own idempotency rules.</text></svg>