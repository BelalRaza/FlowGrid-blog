<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
<title id="title">Coordinating one cron tick</title><desc id="desc">Uniqueness prevents duplicate target records; error handling can skip target creation</desc>
<defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c91a4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#af3b4b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3065ad"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a66308"/></marker></defs>
<rect width="1600" height="1010" fill="#f7f9fc"/>
<rect x="48" y="46" width="9" height="67" rx="4" fill="#087f8c"/>
<text x="80" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#152c43" text-anchor="start" font-weight="700">Coordinating one cron tick</text><text x="80" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">Uniqueness prevents duplicate target records; error handling can skip target creation</text><rect x="80" y="210" width="420" height="125" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="290.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">Read due tick</text><text x="290.0" y="301" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Snapshot plain values</text><rect x="680" y="210" width="840" height="125" rx="18" fill="#edf3fc" stroke="#afc5e7" stroke-width="2"/><text x="1100.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#3065ad" text-anchor="middle" font-weight="700">Compare and swap next_run_at</text><text x="1100.0" y="301" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="middle" font-weight="400">Only a matching stored tick can advance</text><polyline points="500,273 680,273" fill="none" stroke="#7c91a4" stroke-width="3" stroke-linejoin="round" marker-end="url(#gray)"/><rect x="80" y="425" width="680" height="375" rx="18" fill="#edf8f6" stroke="#97cfc9" stroke-width="2"/><text x="120" y="472" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#087f8c" text-anchor="start" font-weight="700">NORMAL CREATION PATH</text><text x="120" y="535" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#152c43" text-anchor="start" font-weight="700">Advance schedule + insert target</text><text x="120" y="582" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#526579" text-anchor="start" font-weight="400">Same database transaction</text><text x="120" y="644" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#087f8c" text-anchor="start" font-weight="400">Commit both → publish after commit</text><text x="120" y="714" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#526579" text-anchor="start" font-weight="400">Crash before commit → both roll back</text><rect x="840" y="425" width="680" height="375" rx="18" fill="#fff5e5" stroke="#e5c691" stroke-width="2"/><text x="880" y="472" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#a66308" text-anchor="start" font-weight="700">TARGET CREATION RAISES</text><text x="880" y="535" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#152c43" text-anchor="start" font-weight="700">Roll back schedule + target</text><text x="880" y="582" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#526579" text-anchor="start" font-weight="400">Advance schedule separately</text><text x="880" y="644" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#526579" text-anchor="start" font-weight="400">Existing target → tick already represented</text><text x="880" y="701" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#a66308" text-anchor="start" font-weight="700">Other error → tick may have no target</text><polyline points="1010,335 1010,380 420,380 420,425" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/><polyline points="1210,335 1210,425" fill="none" stroke="#a66308" stroke-width="3" stroke-linejoin="round" marker-end="url(#amber)"/><text x="80" y="869" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#152c43" text-anchor="start" font-weight="700">Constraint: UNIQUE (schedule_id, scheduled_for)</text><line x1="80" x2="1520" y1="920" y2="920" stroke="#d7e1ea" stroke-width="2"/><text x="80" y="962" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#526579" text-anchor="start" font-weight="400">UTC cron uses minutes. Missed ticks are coalesced. Target creation is distinct from handler execution.</text></svg>